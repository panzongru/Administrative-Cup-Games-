<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>115年行政盃｜台中地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eef0f3;color:#252a31}
#map{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.page-tabs{position:fixed;z-index:3000;top:18px;left:18px;display:flex;gap:5px;padding:5px;background:rgba(255,255,255,.94);border-radius:12px;box-shadow:0 5px 18px rgba(20,30,40,.14)}
.page-tabs a{text-decoration:none;color:#59616a;font-size:13px;font-weight:800;padding:8px 12px;border-radius:8px}
.page-tabs a.active{background:#252a31;color:#fff}.page-tabs{box-shadow:0 4px 14px rgba(20,30,40,.18)}
.top{position:fixed;z-index:2000;left:18px;top:18px;background:rgba(255,255,255,.95);padding:13px 16px;border-radius:16px;box-shadow:0 7px 25px rgba(20,30,40,.12);max-width:390px}
.kicker{font-size:10px;letter-spacing:.16em;color:#8a6b3d;font-weight:800}
.title{font-size:20px;font-weight:850;margin-top:3px}
.desc{font-size:12px;color:#707780;margin-top:3px}
.card{position:fixed;z-index:2000;right:18px;top:18px;width:350px;max-height:calc(100vh - 36px);background:rgba(255,255,255,.96);border-radius:20px;box-shadow:0 12px 40px rgba(20,30,40,.12);overflow:hidden}
.head{padding:12px 14px;border-bottom:1px solid #e4e6e9}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head h2{font-size:15px;margin:0}
.locate-btn,.reset{border:0;border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer}
.locate-btn{background:#252a31;color:#fff}
.reset{background:#f1f2f4;color:#252a31}
.list{display:flex;flex-direction:column;gap:5px;padding:8px 11px;overflow:auto;height:calc(100vh - 115px)}
.item{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid #eef0f2;border-radius:12px;background:#fff;cursor:pointer;min-width:0}
.item>div{flex:1;min-width:0}
.item b{display:block;font-size:13px;line-height:1.2}
.item small{display:block;font-size:10.5px;color:#707780;margin-top:3px;line-height:1.3}
.num{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:16px}
.nav{width:30px;height:30px;flex:none;display:grid;place-items:center;background:#f1f2f4;border-radius:9px;text-decoration:none;font-size:15px}
.user-dot{width:18px;height:18px;border-radius:50%;background:#2878ff;border:3px solid white;box-shadow:0 2px 8px #0005}
@media(max-width:800px){
 #map{height:calc(100% - 116px);bottom:116px}
 .page-tabs{top:8px;right:8px}
 .page-tabs a{padding:7px 10px;font-size:12px}
 .top{left:9px;right:9px;top:10px;max-width:none;padding:9px 12px}
 .title{font-size:17px}
 .desc{font-size:11px}
 .card{left:0;right:0;top:auto;bottom:0;width:100%;height:116px;max-height:none;border-radius:18px 18px 0 0}
 .head{padding:6px 10px 4px}
 .head h2{font-size:13px}
 .list{height:76px;padding:5px 10px 8px;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:8px;-webkit-overflow-scrolling:touch}
 .item{flex:0 0 235px;min-width:235px;height:65px}
 .item b{font-size:12px}
}
</style>
</head>
<body>
<nav class="page-tabs"><a href="index.html">🏆 賽程</a><a href="map.html" class="active">🗺️ 台中地圖</a></nav>
<div id="map"></div>
<div class="top"><div class="kicker">ADMINISTRATIVE CUP</div><div class="title">行政盃｜台中行程地圖</div><div class="desc">📍 定位自己・選擇行程地點・可用 Google Maps 導航</div></div>
<div class="card">
 <div class="head"><div class="headrow"><h2>📍 行程地點</h2><div><button class="locate-btn" onclick="locateMe()">📍 我的位置</button><button class="reset" onclick="resetMap()">全圖</button></div></div></div>
 <div id="list" class="list"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places=[{id:"hotel",cat:"住宿",icon:"🏨",name:"塔木德酒店Choice 台中一中館",sub:"🏨 太平路22號｜一中商圈",lat:24.147801,lng:120.68534,color:"#b27a2f"},
{id:"ntus",cat:"比賽",icon:"🏓",name:"國立臺灣體育運動大學",sub:"🏓 桌球｜雙十路一段16號",lat:24.14870915,lng:120.6876707,color:"#7156a8"},
{id:"sports",cat:"比賽",icon:"🏸",name:"臺中市北區國民運動中心",sub:"🏸🏀 羽球、籃球｜崇德路一段55號",lat:24.1570556,lng:120.6841111,color:"#23836d"},
{id:"yizhong",cat:"景點",icon:"🛍️",name:"一中街",sub:"🛍️ 一中商圈",lat:24.15025,lng:120.68565,color:"#555b63"},
{id:"lion",cat:"餐飲",icon:"🍺",name:"獅兄弟酒館",sub:"🍺 9/10（四）17:30 晚餐｜柳川西路二段150號",lat:24.14645,lng:120.67265,color:"#b45757"},
{id:"steak",cat:"餐飲",icon:"🥩",name:"烘牛炭燒大牛排",sub:"🥩 9/11（五）17:30 晚餐｜中華路一段41號",lat:24.14385,lng:120.67515,color:"#a45f35"},
{id:"haoyun",cat:"活動",icon:"🎉",name:"好運來洲際宴展中心",sub:"🎉 9/12（六）開幕典禮暨選手之夜｜崇德路三段833號",lat:24.199694,lng:120.683999,color:"#3475a8"}];
const map=L.map('map',{zoomControl:false}).setView([24.161,120.681],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
const markers={}, user={marker:null,circle:null};
places.forEach(p=>{
 const icon=L.divIcon({className:'',html:`<div style="width:34px;height:34px;border-radius:12px;background:${p.color};border:3px solid white;box-shadow:0 4px 12px #0004;display:grid;place-items:center;font-size:16px">${p.icon}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
 const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
 const m=L.marker([p.lat,p.lng],{icon}).addTo(map).bindPopup(`<b>${p.name}</b><br><span style="font-size:12px;color:#777">${p.sub}</span><br><a href="${nav}" target="_blank" rel="noopener" style="display:inline-block;margin-top:7px;padding:6px 9px;background:#252a31;color:#fff;text-decoration:none;border-radius:8px;font-size:11px">🧭 Google Maps 導航</a>`);
 m.on('click',()=>focusPlace(p.id)); markers[p.id]=m;
});
function render(){
 document.getElementById('list').innerHTML=places.map(p=>{
  const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  return `<div class="item" data-place-id="${p.id}" onclick="focusPlace('${p.id}')"><span class="num" style="background:${p.color}">${p.icon}</span><div><b>${p.name}</b><small>${p.sub}</small></div><a class="nav" href="${nav}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🧭</a></div>`;
 }).join('');
}
function scrollToPlace(id){
 const el=document.querySelector('.item[data-place-id="'+id+'"]');
 if(el) el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
}

function focusPlace(id){
 const p=places.find(x=>x.id===id);if(!p)return;
 map.setView([p.lat,p.lng],15,{animate:true});
 markers[id].openPopup();
 scrollToPlace(id);
}
function locateMe(){
 if(!navigator.geolocation){alert('此瀏覽器不支援定位功能。');return;}
 navigator.geolocation.getCurrentPosition(pos=>{
  const ll=[pos.coords.latitude,pos.coords.longitude];
  if(user.marker)map.removeLayer(user.marker);
  if(user.circle)map.removeLayer(user.circle);
  const ico=L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  user.marker=L.marker(ll,{icon:ico,zIndexOffset:1000}).addTo(map).bindPopup('<b>📍 我的目前位置</b>');
  user.circle=L.circle(ll,{radius:Math.min(pos.coords.accuracy||30,150),color:'#2878ff',weight:1,fillOpacity:.08}).addTo(map);
  map.setView(ll,15,{animate:true});
 },()=>alert('無法取得目前位置，請確認手機已允許此網站使用定位。'),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
function resetMap(){map.setView([24.161,120.681],13,{animate:true});map.closePopup();}
render();
setTimeout(()=>map.invalidateSize(),300);
</script>
</body></html>
