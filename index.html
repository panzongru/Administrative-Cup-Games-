<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行政盃｜賽程總覽</title>
<style>
:root {
  --ink:#17202a; --muted:#6b7280; --paper:#f5f7f8; --card:#fff;
  --line:#e6e9ed; --accent:#9b6b3d; --accent2:#e9dccd;
  --shadow:0 10px 30px rgba(20,30,40,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink)}
header{background:linear-gradient(135deg,#171d22,#2b3339);color:#fff;padding:42px 20px 34px}
.hero{max-width:1180px;margin:auto}
.kicker{letter-spacing:.18em;font-size:12px;opacity:.7;margin-bottom:10px}
h1{font-size:clamp(32px,5vw,54px);margin:0 0 8px;font-weight:800;letter-spacing:.02em}
.subtitle{opacity:.78;font-size:15px}
.container{max-width:1180px;margin:-18px auto 50px;padding:0 18px;position:relative}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 180px 180px;gap:10px}
input,select{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fafbfc;font-size:15px;color:var(--ink);outline:none}
input:focus,select:focus{border-color:#b38b66;box-shadow:0 0 0 3px #efe5da}
.tabs{display:flex;gap:8px;overflow:auto;padding:18px 2px 4px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;white-space:nowrap;cursor:pointer;color:#505963}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:130px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.day{margin-top:24px}
.day-title{display:flex;align-items:end;justify-content:space-between;margin:0 4px 12px}
.day-title h2{margin:0;font-size:24px}
.day-title small{color:var(--muted)} 
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}

.sport-table-tennis{--sport:#b06b4f;--sport-bg:#f5e3dc}
.sport-badminton{--sport:#4d7c66;--sport-bg:#e2eee8}
.sport-basketball{--sport:#b47a2c;--sport-bg:#f4e9d5}
.sport-football{--sport:#5d6fa8;--sport-bg:#e5e9f5}
.sport-default{--sport:#7a657f;--sport-bg:#eee8ef}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 5px 18px rgba(20,30,40,.04);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sport,var(--accent))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.time{font-size:25px;font-weight:800;letter-spacing:.02em}
.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--sport-bg,var(--accent2));color:var(--sport,var(--accent))}
.meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:12px}
.meta span{background:#f3f4f6;border-radius:7px;padding:5px 8px}
.match{font-size:16px;line-height:1.65;font-weight:600}
.vs{color:var(--accent);font-weight:800;margin:0 5px}
.empty{padding:60px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d7dce1;border-radius:18px}
footer{text-align:center;color:#9aa1a8;font-size:12px;padding:0 20px 35px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}header{padding-top:30px}.container{padding:0 12px}}
.card.mudan-card{background:#d1d5db!important;border-color:#b8bec6!important}
</style>
</head>
<body>

.site-nav{position:fixed;z-index:3000;top:14px;right:16px;display:flex;gap:6px;padding:5px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.06);border-radius:12px;box-shadow:0 5px 18px rgba(20,30,40,.10)}

@media(max-width:700px){.site-nav{top:8px;right:8px}.site-nav a{padding:7px 10px;font-size:12px}}

<header><div class="hero">

<script>
const data=[{"sport": "桌球", "date": "9/11(五)", "time": "09:00", "event": "男子雙打", "group": "O", "match_no": "14.0", "match": "蔡志明、楊健平vs大同鄉公所（邱立擎、李忠仁）"}, {"sport": "桌球", "date": "9/11(五)", "time": "09:00", "event": "男子雙打", "group": "Q", "match_no": "40.0", "match": "蔡重仁、華冠宇vs南投原民處（何聖仁、史新光）"}, {"sport": "桌球", "date": "9/11(五)", "time": "10:30", "event": "男子雙打", "group": "O", "match_no": "62.0", "match": "蔡志明、楊健平vs仁愛鄉代表會（施宜宏、柯富有）"}, {"sport": "桌球", "date": "9/11(五)", "time": "10:30", "event": "男子雙打", "group": "Q", "match_no": "64.0", "match": "蔡重仁、華冠宇vs原民會（邱文隆、雅柏甦詠）"}, {"sport": "桌球", "date": "9/11(五)", "time": "10:30", "event": "女子雙打", "group": "A", "match_no": "1.0", "match": "鄭美櫻、黃莫愁vs東河鄉公所B（姜亭君、林天麗）"}, {"sport": "桌球", "date": "9/11(五)", "time": "10:30", "event": "女子雙打", "group": "A", "match_no": "20.0", "match": "鄭美櫻、黃莫愁vs原民會（洪玲、陳逸寧）"}, {"sport": "桌球", "date": "9/11(五)", "time": "12:00", "event": "男子雙打", "group": "", "match_no": "", "match": "決1-17"}, {"sport": "桌球", "date": "9/11(五)", "time": "12:00", "event": "女子雙打", "group": "", "match_no": "", "match": "決1-17"}, {"sport": "桌球", "date": "9/11(五)", "time": "12:30", "event": "男子雙打", "group": "", "match_no": "", "match": "八強賽"}, {"sport": "桌球", "date": "9/11(五)", "time": "12:30", "event": "女子雙打", "group": "", "match_no": "", "match": "八強賽"}, {"sport": "桌球", "date": "9/11(五)", "time": "13:00", "event": "男子雙打", "group": "", "match_no": "", "match": "四強賽"}, {"sport": "桌球", "date": "9/11(五)", "time": "13:00", "event": "女子雙打", "group": "", "match_no": "", "match": "四強賽"}, {"sport": "桌球", "date": "9/11(五)", "time": "13:00", "event": "女子單打", "group": "G", "match_no": "7.0", "match": "鄭美櫻 vs 桃園市政府（李菀蓉）"}, {"sport": "桌球", "date": "9/11(五)", "time": "13:00", "event": "女子單打", "group": "L", "match_no": "12.0", "match": "黃莫愁 vs 萬榮鄉公所A（余珮蓉）"}, {"sport": "羽球", "date": "9/11(五)", "time": "13:00", "event": "羽球團體組", "group": "A", "match_no": "1.0", "match": "牡丹鄉民代表會vs 秀林鄉公所"}, {"sport": "桌球", "date": "9/11(五)", "time": "13:30", "event": "女子單打", "group": "G", "match_no": "30.0", "match": "鄭美櫻 vs成功鎮公所B（劉昀宣）"}, {"sport": "籃球", "date": "9/11(五)", "time": "13:30", "event": "女子3×3", "group": "B", "match_no": "2.0", "match": "牡丹鄉公所vs 復興區公所 (D場地)"}, {"sport": "羽球", "date": "9/11(五)", "time": "14:00", "event": "羽球團體組", "group": "G", "match_no": "7.0", "match": "牡丹鄉公所vs 和平區公所"}, {"sport": "桌球", "date": "9/11(五)", "time": "14:30", "event": "女子單打", "group": "L", "match_no": "58.0", "match": "黃莫愁 vs 關山鎮公所B（鄭雯華）"}, {"sport": "籃球", "date": "9/11(五)", "time": "14:50", "event": "女子3×3", "group": "B", "match_no": "10.0", "match": "牡丹鄉公所vs 海端鄉公所 (D場地)"}, {"sport": "桌球", "date": "9/11(五)", "time": "15:00", "event": "代表會團體組", "group": "", "match_no": "2.0", "match": "牡丹鄉民代表會VS仁愛鄉民代表會"}, {"sport": "桌球", "date": "9/11(五)", "time": "15:00", "event": "女子單打", "group": "", "match_no": "", "match": "決賽抽籤"}, {"sport": "桌球", "date": "9/11(五)", "time": "15:00", "event": "女子單打", "group": "", "match_no": "", "match": "決1-14"}, {"sport": "羽球", "date": "9/11(五)", "time": "15:00", "event": "羽球團體組", "group": "A", "match_no": "8.0", "match": "牡丹鄉民代表會vs 桃園市公所"}, {"sport": "桌球", "date": "9/11(五)", "time": "15:30", "event": "女子單打", "group": "", "match_no": "", "match": "八強賽"}, {"sport": "桌球", "date": "9/11(五)", "time": "16:00", "event": "女子單打", "group": "", "match_no": "", "match": "四強賽"}, {"sport": "桌球", "date": "9/12(六)", "time": "09:00", "event": "男子單打", "group": "J", "match_no": "36.0", "match": "楊健平vs 泰安鄉公所A（林敏誠）"}, {"sport": "桌球", "date": "9/12(六)", "time": "09:00", "event": "男子單打", "group": "AA", "match_no": "26.0", "match": "蔡志明vs 原民會A2（高淨焱）"}, {"sport": "桌球", "date": "9/12(六)", "time": "09:30", "event": "男子單打", "group": "J", "match_no": "63.0", "match": "楊健平vs 金峰鄉公所B（呂朝強）"}, {"sport": "桌球", "date": "9/12(六)", "time": "09:30", "event": "男子單打", "group": "AA", "match_no": "80.0", "match": "蔡志明vs 成功鎮公所A（孔智杰）"}, {"sport": "桌球", "date": "9/12(六)", "time": "11:00", "event": "男子單打", "group": "", "match_no": "", "match": "決1-20"}, {"sport": "羽球", "date": "9/12(六)", "time": "11:00", "event": "羽球團體組", "group": "G", "match_no": "21.0", "match": "牡丹鄉公所vs達仁鄉公所"}, {"sport": "羽球", "date": "9/12(六)", "time": "11:00", "event": "羽球團體組", "group": "", "match_no": "", "match": "決賽抽籤（分組3取2進入決賽）"}, {"sport": "桌球", "date": "9/12(六)", "time": "12:00", "event": "代表會團體組", "group": "", "match_no": "6.0", "match": "牡丹鄉民代表會VS那瑪夏區民代表會"}, {"sport": "桌球", "date": "9/12(六)", "time": "12:00", "event": "男子單打", "group": "", "match_no": "", "match": "八強賽"}, {"sport": "桌球", "date": "9/12(六)", "time": "12:00", "event": "機關團體甲組", "group": "A", "match_no": "1.0", "match": "牡丹鄉公所vs 卓溪鄉公所"}, {"sport": "羽球", "date": "9/12(六)", "time": "13:00", "event": "羽球團體組", "group": "", "match_no": "", "match": "決賽22-27"}, {"sport": "桌球", "date": "9/12(六)", "time": "13:30", "event": "機關團體甲組", "group": "A", "match_no": "6.0", "match": "牡丹鄉公所vs 大武鄉公所"}, {"sport": "羽球", "date": "9/12(六)", "time": "14:00", "event": "羽球團體組", "group": "", "match_no": "", "match": "八強賽"}, {"sport": "籃球", "date": "9/12(六)", "time": "11:00", "event": "女子3×3", "group": "", "match_no": "", "match": "八強賽"}, {"sport": "桌球", "date": "9/13(日)", "time": "09:00", "event": "機關團體甲組", "group": "A", "match_no": "1.0", "match": "決賽1-6"}, {"sport": "羽球", "date": "9/13(日)", "time": "10:00", "event": "羽球團體組", "group": "", "match_no": "", "match": "四強賽"}, {"sport": "籃球", "date": "9/13(日)", "time": "10:00", "event": "女子3×3", "group": "", "match_no": "", "match": "四強賽"}, {"sport": "桌球", "date": "9/13(日)", "time": "10:30", "event": "代表會團體組", "group": "", "match_no": "", "match": "決賽"}, {"sport": "羽球", "date": "9/13(日)", "time": "11:00", "event": "羽球團體組", "group": "", "match_no": "", "match": "冠亞軍、季殿軍"}, {"sport": "籃球", "date": "9/13(日)", "time": "11:00", "event": "女子3×3", "group": "", "match_no": "", "match": "冠亞軍、季殿軍"}, {"sport": "桌球", "date": "9/13(日)", "time": "10:30", "event": "機關團體甲組", "group": "A", "match_no": "6.0", "match": "四強賽"}, {"sport": "桌球", "date": "9/13(日)", "time": "12:00", "event": "機關團體甲組", "group": "A", "match_no": "11.0", "match": "冠亞軍、季殿軍"}];
const dates=["9/11(五)", "9/12(六)", "9/13(日)"];
const sports=["桌球", "羽球", "籃球"];

// Excel 常把場次讀成 14.0；統一轉成 14
data.forEach(r => {
  if (r.match_no !== undefined && r.match_no !== null) {
    r.match_no = String(r.match_no).trim().replace(/\.0+$/, '');
  }
});

const events=["男子雙打", "女子雙打", "女子單打", "羽球團體組", "女子3×3", "代表會團體組", "男子單打", "機關團體甲組"];

let activeDate = dates[0] || "";

const sportSel=document.getElementById("sport");
const eventSel=document.getElementById("event");

events.forEach(x=>{if(x) eventSel.insertAdjacentHTML("beforeend",`<option>${x}</option>`)});

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function markMudan(s){ return esc(s); }
function splitMatch(s){
  let p=s.split(/\s+vs\s+/i);
  return p.length===2 ? `${markMudan(p[0])} <span class="vs">VS</span> ${markMudan(p[1])}` : markMudan(s);
}
function renderTabs(){
  document.getElementById("dateTabs").innerHTML=dates.map(d=>`<button class="tab ${d===activeDate?'active':''}" onclick="activeDate='${d.replace(/'/g,"\\'")}';render()">${esc(d)}</button>`).join("");
}
function render(){
  renderTabs();
  const q=document.getElementById("search").value.trim().toLowerCase();
  const sp=sportSel.value, ev=eventSel.value;
  let rows=data.filter(r=>r.date===activeDate && (!sp || (sp==="羽球籃球" ? (r.sport==="羽球" || r.sport==="籃球") : r.sport===sp)) && (!ev||r.event===ev));
  if(q) rows=rows.filter(r=>Object.values(r).join(" ").toLowerCase().includes(q));
  rows.sort((a,b)=>a.time.localeCompare(b.time));
  const sec=document.getElementById("schedule");
  if(!rows.length){sec.innerHTML='<div class="empty">找不到符合條件的賽程<br><small>可以換個關鍵字或清除篩選</small></div>';return}
  const groups={};
  rows.forEach(r=>(groups[r.time]??=[]).push(r));
  sec.innerHTML=`<div class="day-title"><h2>${esc(activeDate)}</h2><small>依時間排序</small></div>
    ${Object.entries(groups).map(([time,arr])=>`<div class="day"><div class="grid">${arr.map(r=>`
      <article class="card ${r.sport==="桌球"?"sport-table-tennis":r.sport==="羽球"?"sport-badminton":r.sport==="籃球"?"sport-basketball":r.sport==="足球"?"sport-football":"sport-default"} ${String(r.match||"").includes("代表會")?"mudan-card":""}">
        <div class="top"><div class="time">${esc(r.time)}</div><div class="badge">${esc(r.sport)}</div></div>
        <div class="meta"><span>${esc(r.event)}</span>${r.group?`<span>分組 ${esc(r.group)}</span>`:''}${r.match_no?`<span>場次 ${esc(String(r.match_no).trim().replace(/\.0+$/, ''))}</span>`:''}</div>
        <div class="match">${splitMatch(r.match)}</div>
      </article>`).join("")}</div></div>`).join("")}`;
}
["search","sport","event"].forEach(id=>document.getElementById(id).addEventListener("input",render));
render();
</script>
