t sportTab="全部",activeDate=dates[0]||"";
const eventSel=document.getElementById("event");events.forEach(x=>eventSel.insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function splitMatch(s){let p=s.split(/\s*vs\s*/i);return p.length===2?`${esc(p[0])} <span class="vs">VS</span> ${esc(p[1])}`:esc(s)}
function render(){document.getElementById("sportTabs").innerHTML=`<button class="tab ${sportTab==="全部"?"active":""}" onclick="sportTab='全部';render()">全部球類</button><button class="tab ${sportTab==="桌球"?"active":""}" onclick="sportTab='桌球';render()">🏓 桌球</button><button class="tab ${sportTab==="其他"?"active":""}" onclick="sportTab='其他';render()">🏸 羽球＋ 🏀 籃球</button>`;
document.getElementById("dateTabs").innerHTML=dates.map(d=>`<button class="subtab ${d===activeDate?'active':''}" onclick="activeDate='${d}';render()">${esc(d)}</button>`).join("");
let q=document.getElementById("search").value.trim().toLowerCase(),ev=eventSel.value;
let rows=data.filter(r=>r.date===activeDate&&(sportTab==="全部"?true:(sportTab==="桌球"?r.sport==="桌球":(r.sport==="羽球"||r.sport==="籃球")))&&(!ev||r.event===ev));if(q)rows=rows.filter(r=>Object.values(r).join(" ").toLowerCase().includes(q));rows.sort((a,b)=>a.time.localeCompare(b.time));
document.getElementById("summary").innerHTML=`<div class="stat"><b>${rows.length}</b><span>賽程項目</span></div><div class="stat"><b>${new Set(rows.map(r=>r.time)).size}</b><span>開賽時段</span></div><div class="stat"><b>${new Set(rows.map(r=>r.sport)).size}</b><span>球類</span></div>`;
let sec=document.getElementById("schedule");if(!rows.length){sec.innerHTML='<div class="empty">找不到符合條件的賽程</div>';return}sec.innerHTML=`<div class="day-title"><h2>${esc(activeDate)}</h2><small>依時間排序</small></div><div class="grid">${rows.map(r=>{let cls=r.sport==="桌球"?"sport-table":r.sport==="羽球"?"sport-badminton":"sport-basketball";if(r.match.includes("牡丹鄉民代表會"))cls+=" mutan-rep";return `<article class="card ${cls}"><div class="top"><div class="time">${esc(r.time)}</div><div class="badge">${esc(r.sport)}</div></div><div class="meta"><span>${esc(r.event)}</span>${r.group?`<span>分組 ${esc(r.group)}</span>`:""}${r.match_no?`<span>場次 ${esc(r.match_no)}</span>`:""}</div><div class="match">${splitMatch(r.match)}</div></article>`}).join("")}</div>`}
